# Publishes the recognition server to a Hugging Face Space (free CPU).
# Needs the repository secret HF_TOKEN (a Hugging Face token with write access).
# The Space <your HF name>/melody-reader is created on the first run.
name: Deploy server

on:
  push:
    branches: [main]
    paths: ["space/**", "melody_reader/**", "requirements.txt", ".github/workflows/space.yml"]
  workflow_dispatch:

concurrency:
  group: space
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Check for the token
        id: token
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::warning::Secret HF_TOKEN is not set, so the server was not deployed."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Assemble the Space
        if: steps.token.outputs.ok == 'true'
        run: |
          mkdir build
          cp space/Dockerfile space/README.md space/app.py requirements.txt build/
          cp space/requirements.txt build/server-requirements.txt
          cp -r melody_reader build/
          find build -name __pycache__ -prune -exec rm -rf {} +

      - name: Upload
        if: steps.token.outputs.ok == 'true'
        run: |
          pip install -q huggingface_hub
          python - <<'PY'
          import os
          from huggingface_hub import HfApi

          api = HfApi(token=os.environ["HF_TOKEN"])
          space = api.whoami()["name"] + "/melody-reader"
          api.create_repo(space, repo_type="space", space_sdk="docker", exist_ok=True)
          api.upload_folder(folder_path="build", repo_id=space, repo_type="space",
                            commit_message="Deploy from GitHub", delete_patterns=["*"])
          host = space.replace("/", "-").replace("_", "-").replace(".", "-").lower()
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(f"Server: https://huggingface.co/spaces/{space}\n\nAPI: https://{host}.hf.space\n")
          PY
